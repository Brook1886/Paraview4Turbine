<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- a spanwise profile: radius up the vertical axis, a property bulging out -->
  <g fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- radius axis (vertical) with a short baseline foot -->
    <path d="M5.5 3 L5.5 20.5 L20.5 20.5" stroke-width="1.4"/>
    <!-- radial band ticks up the axis -->
    <path d="M4.2 7 L5.5 7 M4.2 11 L5.5 11 M4.2 15 L5.5 15" stroke-width="1.2"/>
    <!-- the profile: bulges out from the axis and comes back, hub to casing -->
    <path d="M5.5 19 C 14 18 18 15 18 12 C 18 9 14 6 5.5 5" stroke="#1c8f6b" stroke-width="1.9"/>
    <circle cx="18" cy="12" r="1.15" fill="#1c8f6b" stroke="none"/>
  </g>
</svg>
